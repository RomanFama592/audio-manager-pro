name: Release

# Push a tag that matches version.py (e.g. v1.1.0) to build the installer
# and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Check that the tag matches version.py
        shell: pwsh
        run: |
          $version = (python -c "from version import __version__; print(__version__)").Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match version.py ($version)"
          }

      - name: Create virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements-dev.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build (tests + PyInstaller + installer)
        shell: pwsh
        run: .\build.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem dist\installer\*.exe | Select-Object -First 1).FullName
          gh release create "${{ github.ref_name }}" "$installer" `
            --title "Audio Manager Pro ${{ github.ref_name }}" `
            --generate-notes
